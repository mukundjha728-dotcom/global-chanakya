<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- G Cutout Mask for transparent background compatibility -->
    <mask id="g-mask">
      <rect x="-100" y="-100" width="500" height="500" fill="white" />
      <rect x="60" y="15" width="25" height="17" fill="black" />
    </mask>
  </defs>

  <!-- Eagle-Eye Intelligence Symbol -->
  <g transform="translate(0, 25)">
    <!-- Eye Shape Left (Forms a subtle C) -->
    <path d="M0,35 C25,5 50,-5 70,35 C50,75 25,65 0,35 Z" fill="none" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- Eye Shape Right -->
    <path d="M120,35 C95,5 70,-5 50,35 C70,75 95,65 120,35 Z" fill="none" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- Central Iris G -->
    <circle cx="60" cy="35" r="18" fill="none" stroke="#F5F7FA" stroke-width="6" mask="url(#g-mask)"/>
    <line x1="60" y1="35" x2="75" y2="35" stroke="#F5F7FA" stroke-width="6" stroke-linecap="square"/>
    
    <!-- Red Target Pupil -->
    <circle cx="60" cy="35" r="5" fill="#B91C1C"/>
    
    <!-- Precision Crosshairs -->
    <line x1="60" y1="-2" x2="60" y2="12" stroke="#F5F7FA" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="60" y1="58" x2="60" y2="72" stroke="#F5F7FA" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="18" y1="35" x2="32" y2="35" stroke="#F5F7FA" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="88" y1="35" x2="102" y2="35" stroke="#F5F7FA" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
