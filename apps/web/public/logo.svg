<svg viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- G Cutout Mask for transparent background compatibility -->
    <mask id="g-mask">
      <rect x="-50" y="-50" width="300" height="300" fill="white" />
      <rect x="60" y="15" width="25" height="17" fill="black" />
    </mask>
  </defs>

  <!-- Eagle-Eye Intelligence Symbol -->
  <g transform="translate(20, 25)">
    <!-- Eye Shape Left (Forms a subtle C) -->
    <path d="M0,35 C25,5 50,-5 70,35 C50,75 25,65 0,35 Z" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
    
    <!-- Eye Shape Right -->
    <path d="M120,35 C95,5 70,-5 50,35 C70,75 95,65 120,35 Z" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
    
    <!-- Central Iris G -->
    <circle cx="60" cy="35" r="18" fill="none" stroke="#F5F7FA" stroke-width="5" mask="url(#g-mask)"/>
    <line x1="60" y1="35" x2="75" y2="35" stroke="#F5F7FA" stroke-width="5" stroke-linecap="square"/>
    
    <!-- Red Target Pupil -->
    <circle cx="60" cy="35" r="5" fill="#B91C1C"/>
    
    <!-- Precision Crosshairs -->
    <line x1="60" y1="0" x2="60" y2="10" stroke="#F5F7FA" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="60" y1="60" x2="60" y2="70" stroke="#F5F7FA" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="20" y1="35" x2="30" y2="35" stroke="#F5F7FA" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="90" y1="35" x2="100" y2="35" stroke="#F5F7FA" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Typography -->
  <g transform="translate(170, 68)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="42" fill="#F5F7FA" letter-spacing="2">GLOBAL CHANAKYA</text>
    <text x="4" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#D4AF37" letter-spacing="14">INTELLIGENCE</text>
  </g>
</svg>
