services:
  - type: worker
    name: global-chanakya-intelligence-worker
    env: node
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm worker:intelligence
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_DEFAULT_MODEL
        sync: false
      - key: INTELLIGENCE_POLL_INTERVAL_MS
        value: 720000
